headline: Where African fashion research meets the shoot.

bio: >
  Ande Mafenuka, known as Samba, is a wardrobe stylist working between Cape Town
  and Johannesburg, South Africa. He styles editorial, campaign and music-video
  shoots for fashion publications, brands and cultural institutions, including
  The Market Theatre Foundation and Vogue. His credited work covers menswear
  tailoring, occasion dressing, athleisure, and archival and folk dress. He also
  works as a designer and creative researcher, and has taken modelling and
  direction credits on his own editorial projects.


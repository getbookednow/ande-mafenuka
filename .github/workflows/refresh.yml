name: Refresh generated files

on:
  push:
    paths:
      - profile.yml
      - scripts/render.py
  schedule:
    # 03:00 UTC on the 1st of each month — keeps the last-updated stamp fresh
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Render
        run: python3 scripts/render.py

      - name: Validate person.jsonld parses as JSON
        run: |
          python3 -c "import json; json.load(open('person.jsonld')); print('person.jsonld parsed OK')"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Re-render generated files from profile.yml"
            git push
          else
            echo "No changes to commit."
          fi
